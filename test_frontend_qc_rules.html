<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试入院记录质控规则修复</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .test-container {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .test-title {
            color: #1890ff;
            border-bottom: 2px solid #1890ff;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .test-result {
            padding: 12px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success {
            background-color: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }
        .error {
            background-color: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }
        .info {
            background-color: #f0f9ff;
            border: 1px solid #91d5ff;
            color: #1890ff;
        }
        .rule-card {
            background: #fafafa;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            padding: 12px;
            margin: 8px 0;
        }
        .rule-name {
            font-weight: bold;
            color: #262626;
        }
        .rule-desc {
            color: #595959;
            font-size: 14px;
            margin-top: 4px;
        }
        .rule-meta {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            font-size: 12px;
        }
        .tag {
            padding: 2px 8px;
            border-radius: 2px;
            font-size: 11px;
        }
        .tag-category {
            background: #e6f7ff;
            color: #1890ff;
        }
        .tag-severity {
            background: #fff7e6;
            color: #fa8c16;
        }
        button {
            background: #1890ff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #40a9ff;
        }
        .loading {
            color: #1890ff;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 class="test-title">🔧 入院记录质控规则修复测试</h1>
        
        <div id="status" class="test-result info">
            <strong>状态:</strong> 准备测试...
        </div>
        
        <button onclick="testQCRulesAPI()">测试API接口</button>
        <button onclick="testRuleMapping()">测试规则映射</button>
        <button onclick="runFullTest()">完整测试</button>
        
        <div id="results"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8001';
        
        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.className = `test-result ${type}`;
            statusEl.innerHTML = `<strong>状态:</strong> ${message}`;
        }
        
        function addResult(title, content, type = 'info') {
            const resultsEl = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'test-container';
            resultDiv.innerHTML = `
                <h3 style="color: ${type === 'success' ? '#52c41a' : type === 'error' ? '#ff4d4f' : '#1890ff'}">
                    ${title}
                </h3>
                <div class="test-result ${type}">${content}</div>
            `;
            resultsEl.appendChild(resultDiv);
        }
        
        async function testQCRulesAPI() {
            updateStatus('测试API接口...', 'loading');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/qc/sichuan/rules?grouped=true`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                const admissionRules = data.rules_by_document_type?.admission_record || [];
                
                let content = `
                    <p><strong>API响应状态:</strong> ✅ 成功</p>
                    <p><strong>数据源:</strong> ${data.source}</p>
                    <p><strong>总规则数:</strong> ${data.total_rules}</p>
                    <p><strong>文书类型:</strong> ${data.document_types?.join(', ')}</p>
                    <p><strong>入院记录规则数:</strong> ${admissionRules.length}</p>
                `;
                
                if (admissionRules.length > 0) {
                    content += '<h4>入院记录规则列表:</h4>';
                    admissionRules.slice(0, 5).forEach(rule => {
                        content += `
                            <div class="rule-card">
                                <div class="rule-name">${rule.name}</div>
                                <div class="rule-desc">${rule.description}</div>
                                <div class="rule-meta">
                                    <span class="tag tag-category">${rule.category}</span>
                                    <span class="tag tag-severity">${rule.defect_level}</span>
                                </div>
                            </div>
                        `;
                    });
                    if (admissionRules.length > 5) {
                        content += `<p><em>... 还有 ${admissionRules.length - 5} 条规则</em></p>`;
                    }
                }
                
                addResult('📡 API接口测试', content, 'success');
                updateStatus('API测试完成', 'success');
                
            } catch (error) {
                const content = `<p><strong>错误:</strong> ${error.message}</p>`;
                addResult('📡 API接口测试', content, 'error');
                updateStatus('API测试失败', 'error');
            }
        }
        
        function testRuleMapping() {
            updateStatus('测试规则映射逻辑...', 'loading');
            
            // 模拟API数据
            const mockData = {
                rules_by_document_type: {
                    admission_record: [
                        { name: '主诉与现病史一致性检查', category: 'consistency', defect_level: 'minor' },
                        { name: '既往史相关性检查', category: 'completeness', defect_level: 'minor' }
                    ]
                }
            };
            
            // 修复前的逻辑（错误）
            function getApplicableRulesOld(categoryCode, rulesByDocumentType) {
                const categoryMapping = {
                    'admission_record': '入院记录',
                    'progress_note': '病程记录',
                    'discharge_record': '出院记录'
                };
                const chineseName = categoryMapping[categoryCode];
                return rulesByDocumentType[chineseName] || [];
            }
            
            // 修复后的逻辑（正确）
            function getApplicableRulesNew(categoryCode, rulesByDocumentType) {
                return rulesByDocumentType[categoryCode] || [];
            }
            
            const categoryCode = 'admission_record';
            const oldResult = getApplicableRulesOld(categoryCode, mockData.rules_by_document_type);
            const newResult = getApplicableRulesNew(categoryCode, mockData.rules_by_document_type);
            
            let content = `
                <p><strong>测试分类代码:</strong> ${categoryCode}</p>
                <p><strong>修复前结果:</strong> ${oldResult.length} 条规则 ${oldResult.length === 0 ? '❌' : '✅'}</p>
                <p><strong>修复后结果:</strong> ${newResult.length} 条规则 ${newResult.length > 0 ? '✅' : '❌'}</p>
            `;
            
            if (newResult.length > 0) {
                content += '<h4>获取到的规则:</h4>';
                newResult.forEach(rule => {
                    content += `
                        <div class="rule-card">
                            <div class="rule-name">${rule.name}</div>
                            <div class="rule-meta">
                                <span class="tag tag-category">${rule.category}</span>
                                <span class="tag tag-severity">${rule.defect_level}</span>
                            </div>
                        </div>
                    `;
                });
            }
            
            const type = newResult.length > 0 ? 'success' : 'error';
            addResult('🔧 规则映射测试', content, type);
            updateStatus('映射测试完成', type);
        }
        
        async function runFullTest() {
            updateStatus('运行完整测试...', 'loading');
            document.getElementById('results').innerHTML = '';
            
            await testQCRulesAPI();
            await new Promise(resolve => setTimeout(resolve, 1000));
            testRuleMapping();
            
            updateStatus('所有测试完成', 'success');
        }
        
        // 页面加载时自动运行测试
        window.addEventListener('load', () => {
            setTimeout(runFullTest, 500);
        });
    </script>
</body>
</html>
