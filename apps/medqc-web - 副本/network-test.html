<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网络请求测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .result { background: #f9f9f9; padding: 10px; margin: 10px 0; }
        .success { color: green; }
        .error { color: red; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>网络请求测试</h1>
    
    <div class="test">
        <h2>测试1: 直接API调用</h2>
        <button onclick="testDirectAPI()">测试直接API调用</button>
        <div id="direct-result" class="result"></div>
    </div>
    
    <div class="test">
        <h2>测试2: 模拟前端环境</h2>
        <button onclick="testFrontendEnvironment()">测试前端环境</button>
        <div id="frontend-result" class="result"></div>
    </div>

    <script>
        // 测试直接API调用
        async function testDirectAPI() {
            const resultDiv = document.getElementById('direct-result');
            resultDiv.innerHTML = '正在测试...';
            
            try {
                const response = await fetch('http://localhost:8001/api/qc/sichuan/rules?grouped=true');
                const data = await response.json();
                
                const admissionRules = data.rules_by_document_type?.admission_record || [];
                
                resultDiv.innerHTML = `
                    <div class="success">
                        ✅ 直接API调用成功<br>
                        状态码: ${response.status}<br>
                        入院记录规则数量: ${admissionRules.length}<br>
                        总规则数量: ${data.total_rules || 0}
                    </div>
                `;
                
                console.log('直接API调用结果:', data);
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ 直接API调用失败: ${error.message}</div>`;
                console.error('直接API调用错误:', error);
            }
        }
        
        // 测试模拟前端环境
        async function testFrontendEnvironment() {
            const resultDiv = document.getElementById('frontend-result');
            resultDiv.innerHTML = '正在测试前端环境...';
            
            try {
                // 模拟前端的环境变量
                const baseURL = 'http://localhost:8001'; // 模拟 VITE_API_BASE_URL
                
                console.log('🔍 加载质控规则，API URL:', `${baseURL}/api/qc/sichuan/rules?grouped=true`);
                const response = await fetch(`${baseURL}/api/qc/sichuan/rules?grouped=true`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('📋 质控规则API响应:', data);
                
                const rulesByDocumentType = data.rules_by_document_type || {};
                console.log('📊 按文档类型分组的规则:', rulesByDocumentType);
                
                // 模拟 getApplicableRules 函数
                const getApplicableRules = (categoryCode) => {
                    const rules = rulesByDocumentType[categoryCode] || [];
                    console.log(`🎯 获取分类 "${categoryCode}" 的质控规则:`, rules.length, '条规则');
                    return rules;
                };
                
                // 测试入院记录规则获取
                const admissionRules = getApplicableRules('admission_record');
                
                resultDiv.innerHTML = `
                    <div class="success">
                        ✅ 前端环境测试成功<br>
                        API URL: ${baseURL}/api/qc/sichuan/rules?grouped=true<br>
                        响应状态: ${response.status}<br>
                        规则数据结构: ${Object.keys(data).join(', ')}<br>
                        文档类型数量: ${Object.keys(rulesByDocumentType).length}<br>
                        入院记录规则数量: ${admissionRules.length}<br>
                        <br>
                        <strong>所有文档类型及规则数量:</strong><br>
                        ${Object.entries(rulesByDocumentType).map(([type, rules]) => 
                            `${type}: ${rules.length}条`
                        ).join('<br>')}
                    </div>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ 前端环境测试失败: ${error.message}</div>`;
                console.error('前端环境测试错误:', error);
            }
        }
        
        // 页面加载时自动运行测试
        window.addEventListener('load', () => {
            setTimeout(() => {
                testDirectAPI();
                setTimeout(testFrontendEnvironment, 1000);
            }, 500);
        });
    </script>
</body>
</html>
