[pytest]
# Pytest 配置文件

# 测试文件匹配模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = tests

# 输出选项
addopts =
    # 详细输出
    -v
    # 失败时显示局部变量
    -l
    # 显示所有输出
    -s
    # 警告设置
    --strict-markers
    --tb=short
    # 并行执行（可选）
    # -n auto

# 标记定义
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, requires external services)
    slow: Slow tests
    api: API endpoint tests
    service: Service layer tests
    auth: Authentication tests
    qc: Quality control tests
    business_oracle: Frozen business expectations; included by default and never converted to xfail
    appeals: Appeals workflow tests
    remediation: Remediation tracking tests

# 覆盖率配置
[coverage:run]
source = app
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
