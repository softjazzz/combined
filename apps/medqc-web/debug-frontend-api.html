<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端API调试工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
        }
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
        }
        .section h2 {
            margin-top: 0;
            color: #1890ff;
        }
        .btn {
            background: #1890ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn:hover {
            background: #40a9ff;
        }
        .btn.success {
            background: #52c41a;
        }
        .btn.error {
            background: #ff4d4f;
        }
        .result {
            background: #f5f5f5;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            padding: 15px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .status {
            padding: 8px 12px;
            border-radius: 4px;
            margin: 5px 0;
            font-weight: bold;
        }
        .status.success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }
        .status.error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }
        .status.warning {
            background: #fffbe6;
            border: 1px solid #ffe58f;
            color: #faad14;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 前端API调试工具</h1>
        <p>用于诊断语义质控规则管理界面的API连接问题</p>

        <div class="section">
            <h2>1. 后端连接测试</h2>
            <button class="btn" onclick="testBackendConnection()">测试后端连接</button>
            <button class="btn" onclick="testSemanticRulesAPI()">测试语义规则API</button>
            <div id="backend-result" class="result"></div>
        </div>

        <div class="section">
            <h2>2. 前端服务测试</h2>
            <button class="btn" onclick="testSemanticRulesService()">测试前端服务类</button>
            <button class="btn" onclick="simulateComponentLoad()">模拟组件加载</button>
            <div id="frontend-result" class="result"></div>
        </div>

        <div class="section">
            <h2>3. CORS和网络测试</h2>
            <button class="btn" onclick="testCORS()">测试CORS配置</button>
            <button class="btn" onclick="testNetworkConnectivity()">测试网络连通性</button>
            <div id="network-result" class="result"></div>
        </div>

        <div class="section">
            <h2>4. 数据格式验证</h2>
            <button class="btn" onclick="validateDataFormat()">验证数据格式</button>
            <button class="btn" onclick="testDataTransformation()">测试数据转换</button>
            <div id="data-result" class="result"></div>
        </div>
    </div>

    <script>
        // 后端连接测试
        async function testBackendConnection() {
            const resultDiv = document.getElementById('backend-result');
            resultDiv.innerHTML = '🔄 正在测试后端连接...';
            
            try {
                const response = await fetch('http://localhost:8001/api/semantic-rules');
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="status success">✅ 后端连接成功</div>
响应状态: ${response.status}
规则数量: ${data.count || data.rules?.length || 0}
数据结构: ${JSON.stringify(data, null, 2)}`;
                } else {
                    resultDiv.innerHTML = `<div class="status error">❌ 后端响应错误</div>
响应状态: ${response.status}
错误信息: ${JSON.stringify(data, null, 2)}`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">❌ 连接失败</div>
错误信息: ${error.message}
可能原因:
1. 后端服务未启动 (端口8001)
2. CORS配置问题
3. 网络连接问题`;
            }
        }

        // 测试语义规则API
        async function testSemanticRulesAPI() {
            const resultDiv = document.getElementById('backend-result');
            resultDiv.innerHTML = '🔄 正在测试语义规则API...';
            
            const tests = [
                { name: '获取规则列表', url: '/api/semantic-rules' },
                { name: '获取统计信息', url: '/api/semantic-rules/stats' },
                { name: '验证LLM连接', url: '/api/semantic-rules/validate-llm' }
            ];
            
            let results = '';
            
            for (const test of tests) {
                try {
                    const response = await fetch(`http://localhost:8001${test.url}`);
                    const data = await response.json();
                    
                    if (response.ok) {
                        results += `<div class="status success">✅ ${test.name}: 成功</div>`;
                        results += `数据: ${JSON.stringify(data, null, 2)}\n\n`;
                    } else {
                        results += `<div class="status error">❌ ${test.name}: 失败 (${response.status})</div>`;
                        results += `错误: ${JSON.stringify(data, null, 2)}\n\n`;
                    }
                } catch (error) {
                    results += `<div class="status error">❌ ${test.name}: 异常</div>`;
                    results += `错误: ${error.message}\n\n`;
                }
            }
            
            resultDiv.innerHTML = results;
        }

        // 测试前端服务类
        async function testSemanticRulesService() {
            const resultDiv = document.getElementById('frontend-result');
            resultDiv.innerHTML = '🔄 正在测试前端服务类...';
            
            try {
                // 模拟SemanticRulesService的行为
                const baseURL = window.location.hostname === 'localhost'
                    ? 'http://localhost:8001'
                    : 'http://124.220.6.136:8001';
                
                resultDiv.innerHTML += `\n检测到的baseURL: ${baseURL}`;
                
                const response = await fetch(`${baseURL}/api/semantic-rules`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || '获取语义规则失败');
                }
                
                const data = await response.json();
                const result = {
                    success: true,
                    data: data.rules || []
                };
                
                resultDiv.innerHTML = `<div class="status success">✅ 前端服务类测试成功</div>
baseURL: ${baseURL}
响应数据: ${JSON.stringify(result, null, 2)}`;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">❌ 前端服务类测试失败</div>
错误信息: ${error.message}`;
            }
        }

        // 模拟组件加载
        async function simulateComponentLoad() {
            const resultDiv = document.getElementById('frontend-result');
            resultDiv.innerHTML = '🔄 正在模拟组件加载过程...';
            
            try {
                // 模拟refreshRules方法
                const baseURL = 'http://localhost:8001';
                
                // 1. 加载规则列表
                const rulesResponse = await fetch(`${baseURL}/api/semantic-rules`);
                const rulesData = await rulesResponse.json();
                
                // 2. 加载统计信息
                const statsResponse = await fetch(`${baseURL}/api/semantic-rules/stats`);
                const statsData = await statsResponse.json();
                
                // 3. 验证LLM状态
                const llmResponse = await fetch(`${baseURL}/api/semantic-rules/validate-llm`);
                const llmData = await llmResponse.json();
                
                resultDiv.innerHTML = `<div class="status success">✅ 组件加载模拟成功</div>
规则数据: ${JSON.stringify(rulesData, null, 2)}

统计数据: ${JSON.stringify(statsData, null, 2)}

LLM状态: ${JSON.stringify(llmData, null, 2)}`;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">❌ 组件加载模拟失败</div>
错误信息: ${error.message}`;
            }
        }

        // 测试CORS
        async function testCORS() {
            const resultDiv = document.getElementById('network-result');
            resultDiv.innerHTML = '🔄 正在测试CORS配置...';
            
            try {
                const response = await fetch('http://localhost:8001/api/semantic-rules', {
                    method: 'OPTIONS'
                });
                
                const corsHeaders = {
                    'Access-Control-Allow-Origin': response.headers.get('Access-Control-Allow-Origin'),
                    'Access-Control-Allow-Methods': response.headers.get('Access-Control-Allow-Methods'),
                    'Access-Control-Allow-Headers': response.headers.get('Access-Control-Allow-Headers')
                };
                
                resultDiv.innerHTML = `<div class="status success">✅ CORS预检请求成功</div>
CORS头信息: ${JSON.stringify(corsHeaders, null, 2)}`;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">❌ CORS测试失败</div>
错误信息: ${error.message}
建议检查后端CORS配置`;
            }
        }

        // 测试网络连通性
        async function testNetworkConnectivity() {
            const resultDiv = document.getElementById('network-result');
            resultDiv.innerHTML = '🔄 正在测试网络连通性...';
            
            const endpoints = [
                'http://localhost:8001/api/semantic-rules',
                'http://127.0.0.1:8001/api/semantic-rules'
            ];
            
            let results = '';
            
            for (const endpoint of endpoints) {
                try {
                    const startTime = Date.now();
                    const response = await fetch(endpoint);
                    const endTime = Date.now();
                    
                    results += `<div class="status success">✅ ${endpoint}: 连通 (${endTime - startTime}ms)</div>\n`;
                } catch (error) {
                    results += `<div class="status error">❌ ${endpoint}: 不通 (${error.message})</div>\n`;
                }
            }
            
            resultDiv.innerHTML = results;
        }

        // 验证数据格式
        async function validateDataFormat() {
            const resultDiv = document.getElementById('data-result');
            resultDiv.innerHTML = '🔄 正在验证数据格式...';
            
            try {
                const response = await fetch('http://localhost:8001/api/semantic-rules');
                const data = await response.json();
                
                // 验证数据结构
                const validations = [];
                
                if (data.success !== undefined) {
                    validations.push('✅ 包含success字段');
                } else {
                    validations.push('❌ 缺少success字段');
                }
                
                if (data.rules && Array.isArray(data.rules)) {
                    validations.push(`✅ rules字段是数组 (${data.rules.length}条)`);
                    
                    if (data.rules.length > 0) {
                        const rule = data.rules[0];
                        const requiredFields = ['rule_id', 'rule_name', 'description', 'category'];
                        
                        requiredFields.forEach(field => {
                            if (rule[field]) {
                                validations.push(`✅ 规则包含${field}字段`);
                            } else {
                                validations.push(`❌ 规则缺少${field}字段`);
                            }
                        });
                    }
                } else {
                    validations.push('❌ rules字段不是数组或不存在');
                }
                
                resultDiv.innerHTML = `<div class="status success">数据格式验证完成</div>
${validations.join('\n')}

原始数据:
${JSON.stringify(data, null, 2)}`;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">❌ 数据格式验证失败</div>
错误信息: ${error.message}`;
            }
        }

        // 测试数据转换
        async function testDataTransformation() {
            const resultDiv = document.getElementById('data-result');
            resultDiv.innerHTML = '🔄 正在测试数据转换...';
            
            try {
                const response = await fetch('http://localhost:8001/api/semantic-rules');
                const backendData = await response.json();
                
                // 模拟前端数据转换逻辑
                const transformedData = {
                    success: true,
                    data: backendData.rules || []
                };
                
                resultDiv.innerHTML = `<div class="status success">✅ 数据转换测试成功</div>
后端原始数据:
${JSON.stringify(backendData, null, 2)}

前端转换后数据:
${JSON.stringify(transformedData, null, 2)}`;
                
            } catch (error) {
                resultDiv.innerHTML = `<div class="status error">❌ 数据转换测试失败</div>
错误信息: ${error.message}`;
            }
        }

        // 页面加载时自动运行基础测试
        window.addEventListener('load', function() {
            console.log('🔧 前端API调试工具已加载');
            console.log('当前页面URL:', window.location.href);
            console.log('检测到的hostname:', window.location.hostname);
        });
    </script>
</body>
</html>
