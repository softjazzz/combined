name: Single Donghua CDM isolated acceptance
on:
  push:
    branches: [codex/business-single-donghua-cdm-20261106]
permissions:
  contents: read
jobs:
  isolated-pg16:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DATABASE_URL: ''
      REMOTE_DB_URL: ''
      MEDQC_ALLOW_REAL_LLM: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install declared test dependencies
        run: python -m pip install -r apps/medqc-web/backend/requirements.txt
      - name: Focused offline boundary and history regression
        working-directory: apps/medqc-web/backend
        run: sudo --preserve-env=PYTHONDONTWRITEBYTECODE unshare --net -- "$(command -v python)" -B scripts/run_qc_scheduler_tests.py --profile offline tests/unit/test_single_donghua_source.py tests/unit/test_clinical_sources.py tests/unit/test_data_pipelines.py tests/unit/test_case_material_snapshot.py tests/unit/test_bundle_refresh_storage.py tests/unit/test_validation_material_selection.py tests/unit/test_validation_material_display.py
      - name: Fixed CDM and business persistence on owned PG16
        shell: bash
        run: |
          set -euo pipefail
          export JOINT_PYTHON="$(command -v python)"
          sudo --preserve-env=JOINT_PYTHON,GITHUB_WORKSPACE unshare --net bash -euo pipefail <<'ISOLATED' 2>&1 | tee "$RUNNER_TEMP/single-donghua-pg16.log"
          ip link set lo up
          runuser -u "$SUDO_USER" -- env JOINT_PYTHON="$JOINT_PYTHON" MEDQC_PG_TEST_ENTRY=scripts/run_single_donghua_pg_tests.py bash "$GITHUB_WORKSPACE/apps/medqc-web/backend/scripts/run_bundle_refresh_pg_ci.sh"
          ISOLATED
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-donghua-pg16-evidence
          path: ${{ runner.temp }}/single-donghua-pg16.log
