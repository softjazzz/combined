name: E2E Tests - MedQC Workstation

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/medqc-web/src/router/**'
      - 'apps/medqc-web/src/views/workstation-v4/**'
      - 'apps/medqc-web/tests/**'
      - 'apps/medqc-web/playwright.config.ts'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/medqc-web/src/router/**'
      - 'apps/medqc-web/src/views/workstation-v4/**'
      - 'apps/medqc-web/tests/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/medqc-web

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Start backend server
        run: |
          cd backend
          source .venv/bin/activate
          JWT_SECRET=test-secret uvicorn app.main:app --host 0.0.0.0 --port 8001 &
          sleep 10

      - name: Run E2E tests
        run: pnpm exec playwright test
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/medqc-web/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: apps/medqc-web/test-results/
          retention-days: 7
