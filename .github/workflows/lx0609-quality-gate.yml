name: LX0609 Quality Gate - medqc-web

# 0609 质控引擎零模型质量门：规则合同、各执行器、主链聚合与扩展回归。
# 不调用模型、不连接业务库（门禁脚本强制使用临时 SQLite）。
# 与 backend-quality-medqc.yml 分开：后者的其他步骤存在与 0609 无关的历史问题，
# 且其触发分支（main/develop）在本仓库远端不存在。
on:
  pull_request:
    branches: [master, push-fix-clean, codex/business-agent-integration]
    paths:
      - 'apps/medqc-web/backend/**'
      - '.github/workflows/lx0609-quality-gate.yml'
  push:
    branches: [master, push-fix-clean, 'codex/**']
    paths:
      - 'apps/medqc-web/backend/**'
      - '.github/workflows/lx0609-quality-gate.yml'
  workflow_dispatch:

jobs:
  lx0609-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/medqc-web/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xdist==3.5.0

      - name: LX0609 no-model quality gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        # OS 层隔离覆盖 Python/native libpq 及子进程；门禁仍强制使用临时 SQLite。
        run: sudo --preserve-env=PYTHONDONTWRITEBYTECODE unshare --net -- "$(command -v python)" scripts/run_luxian_0609_quality_gate.py --profile pr-no-model
