permissions:
  contents: read

jobs:
  frontend-type-and-focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    defaults:
      run:
        working-directory: apps/medqc-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/medqc-web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Full type check
        run: npm run type-check
      - name: Focused task status and presentation tests
        # 依赖已安装；测试及其子进程使用独立网络命名空间，不能访问模型或业务库。
        run: sudo --preserve-env=NODE_OPTIONS unshare --net -- "$(command -v node)" node_modules/vitest/vitest.mjs run tests/unit/views/workstation-v4/customer-sample-validation/CustomerSampleQcTaskStatusBar.spec.ts tests/unit/views/workstation-v4/customer-sample-validation/batchJobPresentation.spec.ts tests/unit/views/workstation-v4/semantic-rules/useSichuanBatchJobs.f08.spec.ts tests/unit/views/workstation-v4/latestQcFailureSummary.spec.ts tests/unit/views/workstation-v4/QcRecordResultListView.spec.ts tests/unit/views/workstation-v4/components/qc/QcRecordReviewPreview.spec.ts tests/unit/views/workstation-v4/usePatientRecords.spec.ts tests/unit/views/workstation/QCOverviewView.spec.ts --maxWorkers=1 --minWorkers=1
      - name: Read-only lint of changed frontend scope
        run: npx eslint src/views/workstation-v4/customer-sample-validation/CustomerSampleQcTaskStatusBar.vue src/views/workstation-v4/customer-sample-validation/batchJobPresentation.ts src/views/workstation-v4/semantic-rules/types.ts src/views/workstation-v4/normalize.ts src/views/workstation-v4/types.ts src/views/workstation-v4/components/qc/latestQcSummaryPresentation.ts src/views/workstation-v4/components/qc/QcRecordReviewPreview.vue src/views/workstation-v4/QcRecordResultListView.vue src/views/workstation/QCOverviewView.vue src/views/workstation-v2/types.ts
      - name: Frontpage presentation, export races and preserved navigation
        run: sudo --preserve-env=NODE_OPTIONS unshare --net -- "$(command -v node)" node_modules/vitest/vitest.mjs run src/views/workstation-v4/frontpage-qc/__tests__ src/components/layout/__tests__/workstationNav.spec.ts --maxWorkers=1 --minWorkers=1
      - name: Read-only frontpage lint
        run: node node_modules/eslint/bin/eslint.js src/views/workstation-v4/frontpage-qc src/services/frontpage-qc-v2-service.ts src/components/layout/workstationNav.ts src/components/layout/__tests__/workstationNav.spec.ts --quiet
      - name: Local model settings and navigation compatibility (isolated)
        run: sudo --preserve-env=NODE_OPTIONS unshare --net -- "$(command -v node)" --require ./scripts/frontpage-v2-no-network.cjs node_modules/vitest/vitest.mjs run tests/unit/components/LLMApiConfigStrata.spec.ts tests/unit/views/workstation-v4/DataSyncConfigPage.spec.ts tests/unit/router/workstation-report-adaptation.spec.ts --maxWorkers=1 --minWorkers=1
      - name: Read-only local model settings lint
        run: node node_modules/eslint/bin/eslint.js src/components/LLMApiConfig.vue src/services/llmConfigService.ts --no-fix --max-warnings 0
      - name: Page initialization and silent source departments (isolated)
        # 保留OS网络隔离，并叠加固定应答入口的HTTP/socket阻断。
        run: >-
          sudo --preserve-env=NODE_OPTIONS unshare --net -- "$(command -v node)"
          --require ./scripts/frontpage-v2-no-network.cjs node_modules/vitest/vitest.mjs run
          --config vitest.page-load.config.ts
          tests/unit/views/workstation-v4/CustomerSampleValidationView.spec.ts
          tests/unit/views/workstation-v4/customer-sample-validation/deferredComponent.spec.ts
          tests/unit/router/customer-sample-validation-permissions.spec.ts
          tests/unit/services/llm-config-service.spec.ts tests/unit/vite-manual-chunks.spec.ts
          tests/unit/views/workstation-v4/useDataSync.background.spec.ts
          tests/unit/views/workstation-v4/useDataSync.spec.ts
          tests/unit/views/workstation-v4/DataSyncConfigPage.spec.ts
          tests/unit/services/sync-departments.spec.ts
          tests/unit/views/workstation-v4/components/qc/QcSyncAndRunControl.spec.ts
      - name: Read-only page loading and background lookup lint
        run: >-
          node node_modules/eslint/bin/eslint.js --no-fix --quiet
          src/api/sync.ts src/views/workstation-v4/composables/useDataSync.ts
          src/views/workstation-v4/DataSyncConfigPage.vue src/views/workstation-v4/CustomerSampleValidationView.vue
          src/views/workstation-v4/customer-sample-validation/deferredComponent.ts
          src/views/workstation-v4/customer-sample-validation/useCustomerSampleValidationController.ts
          tests/page-load-offline-setup.ts vitest.page-load.config.ts vite.config.mjs
      - name: Clinical source selection and frozen job document origin (isolated)
        run: >-
          sudo --preserve-env=NODE_OPTIONS unshare --net -- "$(command -v node)"
          --require ./scripts/frontpage-v2-no-network.cjs node_modules/vitest/vitest.mjs run
          --config vitest.clinical-sources.config.mts
      - name: Read-only clinical source configuration lint
        run: >-
          node node_modules/eslint/bin/eslint.js --no-fix --quiet
          src/api/clinicalSources.ts src/utils/clinical-source.ts
          src/views/workstation-v4/components/system-config/ClinicalSourceSettingsPanel.vue
          src/views/workstation-v4/composables/usePatientRecords.ts
          src/views/workstation-v4/components/qc/QcRunSelectedControl.vue
