name: QC Workstation Frontend Validation

on:
  pull_request:
    branches: [codex/business-agent-integration]
    paths:
      - 'apps/medqc-web/src/views/workstation-v4/customer-sample-validation/**'
      - 'apps/medqc-web/src/views/workstation-v4/semantic-rules/types.ts'
      - 'apps/medqc-web/src/views/workstation-v4/semantic-rules/composables/useSichuanBatchJobs.ts'
      - 'apps/medqc-web/tests/unit/views/workstation-v4/semantic-rules/useSichuanBatchJobs.f08.spec.ts'
      - 'apps/medqc-web/tests/unit/views/workstation-v4/customer-sample-validation/**'
      - 'apps/medqc-web/src/views/workstation-v4/normalize.ts'
      - 'apps/medqc-web/src/views/workstation-v4/types.ts'
      - 'apps/medqc-web/src/views/workstation-v4/components/qc/latestQcSummaryPresentation.ts'
      - 'apps/medqc-web/src/views/workstation-v4/QcRecordResultListView.vue'
      - 'apps/medqc-web/src/views/workstation/QCOverviewView.vue'
      - 'apps/medqc-web/src/views/workstation-v2/types.ts'
      - 'apps/medqc-web/tests/unit/views/workstation-v4/latestQcFailureSummary.spec.ts'
      - 'apps/medqc-web/tests/unit/views/workstation-v4/QcRecordResultListView.spec.ts'
      - 'apps/medqc-web/tests/unit/views/workstation-v4/usePatientRecords.spec.ts'
      - 'apps/medqc-web/tests/unit/views/workstation/QCOverviewView.spec.ts'
      - 'apps/medqc-web/tsconfig*.json'
      - 'apps/medqc-web/package*.json'
      - '.github/workflows/qc-workstation-frontend-validation.yml'
  push:
    branches: ['codex/**']
    paths:
      - 'apps/medqc-web/src/views/workstation-v4/customer-sample-validation/**'
      - 'apps/medqc-web/src/views/workstation-v4/semantic-rules/types.ts'
      - 'apps/medqc-web/src/views/workstation-v4/semantic-rules/composables/useSichuanBatchJobs.ts'
      - 'apps/medqc-web/tests/unit/views/workstation-v4/semantic-rules/useSichuanBatchJobs.f08.spec.ts'
      - 'apps/medqc-web/tests/unit/views/workstation-v4/customer-sample-validation/**'
      - 'apps/medqc-web/src/views/workstation-v4/normalize.ts'
      - 'apps/medqc-web/src/views/workstation-v4/types.ts'
      - 'apps/medqc-web/src/views/workstation-v4/components/qc/latestQcSummaryPresentation.ts'
      - 'apps/medqc-web/src/views/workstation-v4/QcRecordResultListView.vue'
      - 'apps/medqc-web/src/views/workstation/QCOverviewView.vue'
      - 'apps/medqc-web/src/views/workstation-v2/types.ts'
      - 'apps/medqc-web/tests/unit/views/workstation-v4/latestQcFailureSummary.spec.ts'
      - 'apps/medqc-web/tests/unit/views/workstation-v4/QcRecordResultListView.spec.ts'
      - 'apps/medqc-web/tests/unit/views/workstation-v4/usePatientRecords.spec.ts'
      - 'apps/medqc-web/tests/unit/views/workstation/QCOverviewView.spec.ts'
      - 'apps/medqc-web/tsconfig*.json'
      - 'apps/medqc-web/package*.json'
      - '.github/workflows/qc-workstation-frontend-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-type-and-focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    defaults:
      run:
        working-directory: apps/medqc-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/medqc-web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Full type check
        run: npm run type-check
      - name: Focused task status and presentation tests
        # 依赖已安装；测试及其子进程使用独立网络命名空间，不能访问模型或业务库。
        run: sudo --preserve-env=NODE_OPTIONS unshare --net -- "$(command -v node)" node_modules/vitest/vitest.mjs run tests/unit/views/workstation-v4/customer-sample-validation/CustomerSampleQcTaskStatusBar.spec.ts tests/unit/views/workstation-v4/customer-sample-validation/batchJobPresentation.spec.ts tests/unit/views/workstation-v4/semantic-rules/useSichuanBatchJobs.f08.spec.ts tests/unit/views/workstation-v4/latestQcFailureSummary.spec.ts tests/unit/views/workstation-v4/QcRecordResultListView.spec.ts tests/unit/views/workstation-v4/usePatientRecords.spec.ts tests/unit/views/workstation/QCOverviewView.spec.ts --maxWorkers=1 --minWorkers=1
      - name: Read-only lint of changed frontend scope
        run: npx eslint src/views/workstation-v4/customer-sample-validation/CustomerSampleQcTaskStatusBar.vue src/views/workstation-v4/customer-sample-validation/batchJobPresentation.ts src/views/workstation-v4/semantic-rules/types.ts src/views/workstation-v4/normalize.ts src/views/workstation-v4/types.ts src/views/workstation-v4/components/qc/latestQcSummaryPresentation.ts src/views/workstation-v4/QcRecordResultListView.vue src/views/workstation/QCOverviewView.vue src/views/workstation-v2/types.ts
