name: Business refresh repair PG16 candidate
on:
  push:
    branches: [codex/business-bundle-refresh-repair-20261105]
permissions:
  contents: read
jobs:
  isolated-pg16:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      DATABASE_URL: ''
      REMOTE_DB_URL: ''
      MEDQC_ALLOW_REAL_LLM: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install declared test dependencies
        run: python -m pip install -r apps/medqc-web/backend/requirements.txt
      - name: Focused offline contract regression
        working-directory: apps/medqc-web/backend
        run: sudo --preserve-env=PYTHONDONTWRITEBYTECODE unshare --net -- "$(command -v python)" -B scripts/run_qc_scheduler_tests.py --profile offline tests/unit/test_bundle_refresh_storage.py tests/unit/test_qc_sample_pools_router.py::test_create_test_record_should_forward_source_metadata tests/unit/test_test_case_evaluation_date.py tests/unit/test_bundle_refresh_lx0609_material_contract.py tests/unit/test_acceptance_startup.py tests/unit/test_linux_server_startup.py tests/unit/test_frontpage_qc_v2_migration_graph.py tests/unit/test_customer_test_record_storage_schema.py tests/unit/test_local_readonly_guard.py
      - name: PG16 owned schema, lifecycle and customer material matrix
        shell: bash
        run: |
          set -euo pipefail
          export JOINT_PYTHON="$(command -v python)"
          sudo --preserve-env=JOINT_PYTHON,GITHUB_WORKSPACE unshare --net bash -euo pipefail <<'ISOLATED' 2>&1 | tee "$RUNNER_TEMP/business-refresh-pg16.log"
          ip link set lo up
          runuser -u "$SUDO_USER" -- env JOINT_PYTHON="$JOINT_PYTHON" bash "$GITHUB_WORKSPACE/apps/medqc-web/backend/scripts/run_bundle_refresh_pg_ci.sh"
          ISOLATED
      - name: Build review-only candidate
        run: python -B apps/medqc-web/scripts/build_refresh_repair_candidate.py --out "$RUNNER_TEMP/refresh-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: business-refresh-repair-candidate
          path: ${{ runner.temp }}/refresh-candidate/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-refresh-pg16-evidence
          path: ${{ runner.temp }}/business-refresh-pg16.log
