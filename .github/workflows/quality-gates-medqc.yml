name: Quality Gates - medqc-web

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '*'
      - 'apps/medqc-web/**'
      - '.github/workflows/quality-gates-medqc.yml'
  push:
    branches: [main, develop]
    paths:
      - '*'
      - 'apps/medqc-web/**'
      - '.github/workflows/quality-gates-medqc.yml'
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/medqc-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Repository hygiene check
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        working-directory: .
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: node apps/medqc-web/scripts/check-repo-hygiene.mjs --diff-base "$DIFF_BASE"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Encoding check
        run: pnpm run check:encoding:all

      - name: Type check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm run test:unit
