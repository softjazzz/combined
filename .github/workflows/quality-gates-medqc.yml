name: Quality Gates - medqc-web

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/medqc-web/**'
      - '.github/workflows/quality-gates-medqc.yml'
  push:
    branches: [main, develop]
    paths:
      - 'apps/medqc-web/**'
      - '.github/workflows/quality-gates-medqc.yml'
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/medqc-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Encoding check
        run: pnpm run check:encoding:all

      - name: Type check
        run: pnpm run type-check

      - name: Unit tests
        run: pnpm run test:unit
